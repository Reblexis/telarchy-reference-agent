name: Tests
on:
  push:
    branches: ['**']
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the client
        run: pip install "telarchy @ git+https://github.com/Reblexis/telarchy-app#subdirectory=clients/python"
      - name: Test
        run: python3 -m unittest discover -v
