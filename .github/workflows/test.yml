name: Tests
on:
  push:
    branches: ['**']
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the client
        run: python -m pip install -r requirements.txt
      - name: Test
        run: python -m unittest discover -v

  # The commands telarchy.com/agents tells a newcomer to paste, run as written
  # in the shell it names. They failed for every visitor once (2026-09-17)
  # because nothing ever ran them.
  pasted-commands:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: macOS / Linux, as pasted
        if: runner.os != 'Windows'
        shell: bash
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
          .venv/bin/python agent.py
          .venv/bin/python agent.py --workspace 'telarchy'
      - name: Windows PowerShell, as pasted
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          py -3 -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt
          .\.venv\Scripts\python.exe agent.py
          if ($LASTEXITCODE -ne 0) { exit 1 }
          .\.venv\Scripts\python.exe agent.py --workspace 'telarchy'
          if ($LASTEXITCODE -ne 0) { exit 1 }
